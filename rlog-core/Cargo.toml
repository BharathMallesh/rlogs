[package]
name = "rlog-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
crossbeam-channel = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
lazy_static = "1.4"
quick-xml = "0.31"
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["clock"] }
flate2 = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
