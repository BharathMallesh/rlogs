plugins {
    id 'java'
    id 'maven-publish'
}

group = 'org.apache.logging.log4j'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    // FFM (java.lang.foreign) requires Java 22+. Keep this in sync with the
    // toolchain used in CI (Java 23 on this workstation).
    sourceCompatibility = JavaVersion.VERSION_22
    targetCompatibility = JavaVersion.VERSION_22
}

dependencies {
    implementation 'org.apache.logging.log4j:log4j-api:2.20.0'
    implementation 'org.yaml:snakeyaml:2.2'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Real Log4j2 — used only by the head-to-head benchmark
    testImplementation 'org.apache.logging.log4j:log4j-core:2.20.0'
    testImplementation 'com.lmax:disruptor:3.4.4'
}

test {
    useJUnitPlatform()
    // FFM marks downcall handles as "restricted" — silence the warning.
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'org.apache.logging.log4j'
            artifactId = 'rlog4j-all-platforms'
            version = '0.1.0-SNAPSHOT'
        }
    }
}
