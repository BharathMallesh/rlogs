plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'org.apache.logging.log4j'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

// Base compilation targets Java 11 (JNI path, compatible with Java 8+)
java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

// Java 22 source set for the FFM override (Multi-Release JAR)
sourceSets {
    java22 {
        java {
            srcDir 'src/main/java22'
        }
        compileClasspath += main.compileClasspath + main.output
    }
}

dependencies {
    api 'org.apache.logging.log4j:log4j-api:2.20.0'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

// Compile the Java 22 source set with --release 22
compileJava22Java {
    options.release = 22
}

// Bundle base classes + Java 22 classes under META-INF/versions/22/
jar {
    manifest {
        attributes 'Multi-Release': 'true'
    }
    into('META-INF/versions/22') {
        from sourceSets.java22.output
    }
}

test {
    useJUnitPlatform()
    jvmArgs += ["--enable-native-access=ALL-UNNAMED"]
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'org.apache.logging.log4j'
            artifactId = 'rlog4j-all-platforms'
            version = '0.1.0-SNAPSHOT'
        }
    }
}
