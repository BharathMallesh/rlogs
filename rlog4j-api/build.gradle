plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'org.apache.logging.log4j'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    // FFM (java.lang.foreign) requires Java 22+. Use a Gradle toolchain so
    // that even build environments without a Java 22 JDK installed (e.g.
    // JitPack's default image) auto-download Temurin 22 to compile against.
    toolchain {
        languageVersion = JavaLanguageVersion.of(22)
    }
}

dependencies {
    // `api` exposes log4j-api to consumers at compile time so they can use
    // Logger, LogManager, ThreadContext, MarkerManager, etc. directly.
    api 'org.apache.logging.log4j:log4j-api:2.20.0'
    implementation 'org.yaml:snakeyaml:2.2'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Real Log4j2 — used only by the head-to-head benchmark
    testImplementation 'org.apache.logging.log4j:log4j-core:2.20.0'
    testImplementation 'com.lmax:disruptor:3.4.4'
}

test {
    useJUnitPlatform()
    // FFM marks downcall handles as "restricted" — silence the warning.
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'org.apache.logging.log4j'
            artifactId = 'rlog4j-all-platforms'
            version = '0.1.0-SNAPSHOT'
        }
    }
}
